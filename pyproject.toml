[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artools"
version = "0.0.1"
authors = [
  { name="James Butler" },
]
description = "Tools and routines for constructing and managing datasets of Antarctic ARs."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==2.4.*",
    "pandas==3.0.*",
    "scikit-learn==1.8.*",
    "xarray==2026.2.*",
    "ray==2.54.*",
    "requests==2.32.*",
    "matplotlib==3.10.*",
    "earthaccess==0.16.*",
    "tqdm",
    "cartopy==0.25.*",
    "huggingface_hub==1.9.*",
    "netcdf4",
    "dask==2026.3.*",
    "tables==3.11.*",
    "h5netcdf==1.8.*",
    "h5py==3.16.*",
    "fastparquet"
]

[project.optional-dependencies]
# offload the storm attribute aggregation to zagg's temporal pipeline
# (englacial/zagg#213). 0.27 is the floor: the temporal engine landed in 0.25
# (englacial/zagg#214), 0.26 added the Lambda-layer xarray/h5netcdf deps
# (englacial/zagg#220), and 0.27 carries the split credential channels the
# payload builder emits (englacial/zagg#223) -- an older client silently drops
# input_credentials, which 403s against a public mirror from any account that
# does not own it.
zagg = ["zagg>=0.27"]

[project.urls]
"Homepage" = "https://github.com/jbbutler/antarctic_AR_dataset"
"Bug Tracker" = "https://github.com/jbbutler/antarctic_AR_dataset/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["artools*"]
